services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # Load the real config at runtime. Runtime env overrides the (empty) values
    # baked into the image by the Dockerfile's ENV lines. This is what makes the
    # backend boot locally; in production CapRover injects these instead.
    env_file:
      - ./server/.env
